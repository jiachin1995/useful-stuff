---
- name: Setup and Deploy Web Server
  hosts: test_pc
  become: true # Runs as root/admin

  tasks:
    - name: Ensure Nginx is installed
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Ensure web root directory exists
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        mode: "0755"

    - name: Write custom index.html to the server
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <body>
            <h1>Welcome to my Ansible-managed Server</h1>
            <p>Deployed via DevOps pipeline.</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        mode: "0644"

    - name: Ensure Nginx conf.d directory exists
      ansible.builtin.file:
        path: /etc/nginx/conf.d
        state: directory
        mode: '0755'

    - name: Overwrite main nginx.conf with a working version
      ansible.builtin.copy:
        dest: /etc/nginx/nginx.conf
        content: |
          events {
              worker_connections 1024;
          }

          http {
              server {
                  listen 80;
                  location / {
                      root /var/www/html;
                      index index.html;
                  }
              }
          }
        mode: '0644'

    - name: Kill any existing nginx and start fresh
      ansible.builtin.shell: |
        pkill nginx || true
        nginx
      changed_when: false
